<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The BAID X app on the web: the same account, members and checklist as the mobile app.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BAID X">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="assets/assets/images/logo/baidx_mark.png">
  <link rel="preload" as="image" href="assets/assets/images/logo/baidx_logo_white.png">
  <title>BAID X App</title>
  <style>
    /* The app's splash (lib/features/splash/presentation/splash_screen.dart), drawn in the page
       itself so it shows the instant the page opens, while the app downloads. It stays until
       the app has started and left its splash route, then fades out. */
    html, body { height: 100%; margin: 0; background: #000; color: #f6f6f7; color-scheme: dark; }
    #boot { position: fixed; inset: 0; z-index: 10; overflow: hidden; background: #000; transition: opacity .45s ease; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot .grid { position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 44px 44px; background-position: center;
      -webkit-mask-image: radial-gradient(circle at 50% 46%, #000, transparent 62%); mask-image: radial-gradient(circle at 50% 46%, #000, transparent 62%); }
    #boot .glow { position: absolute; left: 50%; top: 46%; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,.05) 45%, transparent 70%); animation: bGlow 3.3s ease-in-out infinite; }
    #boot .vig { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,.85)); }
    #boot .center { position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; }
    #boot .mark { position: relative; width: 150px; height: 150px; display: grid; place-items: center; }
    #boot svg { position: absolute; inset: 0; width: 150px; height: 150px; overflow: visible; }
    #boot .r1 { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 1.4; stroke-dasharray: 578; stroke-dashoffset: 578; transform-origin: 75px 75px; transform: rotate(-90deg); animation: bDraw .8s cubic-bezier(.6,0,.2,1) .15s forwards; }
    #boot .r2 { fill: none; stroke: rgba(255,255,255,.25); stroke-width: 1; stroke-dasharray: 3 7; opacity: 0; transform-origin: 75px 75px; animation: bFade .5s ease .45s forwards, bSpin 14s linear infinite; }
    #boot .orbit { transform-origin: 75px 75px; animation: bOrbit 1.8s cubic-bezier(.5,0,.3,1) .25s infinite; }
    #boot .orbit circle { fill: #fff; filter: drop-shadow(0 0 4px #fff); }
    #boot .logo { width: 92px; height: 92px; border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.4), 0 20px 60px rgba(255,255,255,.18);
      opacity: 0; transform: scale(.6); animation: bPop .6s cubic-bezier(.2,.9,.25,1.15) .05s forwards; }
    #boot .logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
    #boot .word { margin-top: 20px; width: 188px; height: 47px; overflow: hidden; clip-path: inset(0 100% 0 0); animation: bWipe .55s cubic-bezier(.6,0,.2,1) .5s forwards; }
    #boot .word img { width: 245px; margin-left: -63px; display: block; }
    #boot .tag { margin-top: 14px; font: 600 11.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .34em; color: #9a9a9a; text-transform: uppercase; opacity: 0; transform: translateY(10px); animation: bUp .5s ease .85s forwards; }
    #boot .by { position: absolute; left: 0; right: 0; bottom: calc(46px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; }
    #boot .line { width: 1px; height: 0; background: linear-gradient(#fff, transparent); animation: bLine .5s ease 1s forwards; }
    #boot .by small { margin-top: 16px; font: 600 10.5px/1 ui-monospace, Menlo, monospace; letter-spacing: .3em; color: #777; opacity: 0; animation: bFade .45s ease 1.1s forwards; }
    #boot .by strong { margin-top: 10px; font: 800 19px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .32em; padding-left: .32em; opacity: 0;
      color: transparent; background: linear-gradient(100deg, #7a7a7a 20%, #fff 45%, #fff 55%, #7a7a7a 80%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text;
      animation: bFade .45s ease 1.1s forwards, bShine 1.8s linear 1.1s infinite; }
    #boot .prog { margin-top: 20px; width: 120px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; opacity: 0; animation: bFade .3s ease .1s forwards; }
    #boot .prog i { display: block; width: 100%; height: 100%; border-radius: 2px; background: #fff; box-shadow: 0 0 8px #fff; transform-origin: left; transform: scaleX(0); animation: bFill 5s linear forwards; }
    @keyframes bGlow { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes bDraw { to { stroke-dashoffset: 0; } }
    @keyframes bFade { to { opacity: 1; } }
    @keyframes bSpin { to { transform: rotate(360deg); } }
    @keyframes bOrbit { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes bPop { to { opacity: 1; transform: none; } }
    @keyframes bWipe { to { clip-path: inset(0 0 0 0); } }
    @keyframes bUp { to { opacity: 1; transform: none; } }
    @keyframes bLine { to { height: 34px; } }
    @keyframes bShine { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    @keyframes bFill { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      #boot *, #boot *::before { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <div id="boot" role="img" aria-label="BAID X, powered by Baiden Creatives">
    <div class="grid"></div><div class="glow"></div><div class="vig"></div>
    <div class="center">
      <div class="mark">
        <svg viewBox="0 0 150 150" aria-hidden="true">
          <circle class="r1" cx="75" cy="75" r="72" />
          <circle class="r2" cx="75" cy="75" r="62" />
          <g class="orbit"><circle cx="75" cy="3" r="3" /></g>
        </svg>
        <div class="logo"><img src="assets/assets/images/logo/baidx_mark.png" alt=""></div>
      </div>
      <div class="word"><img src="assets/assets/images/logo/baidx_logo_white.png" alt=""></div>
      <div class="tag">Ghana&rsquo;s work network</div>
    </div>
    <div class="by">
      <i class="line"></i>
      <small>POWERED BY</small>
      <strong>BAIDEN CREATIVES</strong>
      <div class="prog"><i></i></div>
    </div>
  </div>
  <script>
    // Leave once the app has drawn its first frame and moved past its splash route, and
    // never before 5 seconds: the opening plays fast, then the bar fills to the end.
    (function () {
      var boot = document.getElementById('boot'), started = Date.now(), ready = false, done = false;
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, minMs = calm ? 600 : 5000;
      function onSplash() { return /^#\/?splash/.test(location.hash) || location.hash === '' || location.hash === '#/'; }
      function tryLeave() {
        if (done || !ready || onSplash()) return;
        var wait = Math.max(0, minMs - (Date.now() - started));
        done = true;
        setTimeout(function () { boot.classList.add('out'); setTimeout(function () { boot.remove(); }, 500); }, wait);
      }
      window.addEventListener('flutter-first-frame', function () { ready = true; tryLeave(); });
      window.addEventListener('hashchange', tryLeave);
      // safety: never hold the page for more than 20 seconds
      setTimeout(function () { if (!done) { done = true; boot.classList.add('out'); setTimeout(function () { boot.remove(); }, 500); } }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
