<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The BAID X app on the web: the same account, members and checklist as the mobile app.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BAID X">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="manifest" href="manifest.json">
  <title>BAID X App</title>
  <style>
    /* While the app downloads: the black drawing board of the app's splash
       (lib/features/splash/presentation/splash_screen.dart) with a quiet pulse. It leaves
       on the app's first frame, and the app's splash then sketches the logo. */
    html, body { height: 100%; margin: 0; background: #000; color: #f6f6f7; color-scheme: dark; }
    #boot { position: fixed; inset: 0; z-index: 10; overflow: hidden; background: #000; transition: opacity .3s ease; }
    #boot.out { opacity: 0; pointer-events: none; }
    #boot .grid { position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px); background-size: 48px 100%; background-position: center;
      -webkit-mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000, transparent); mask-image: radial-gradient(ellipse 60% 70% at 50% 50%, #000, transparent); }
    #boot .dots { position: absolute; left: 50%; top: 50%; display: flex; gap: 8px; transform: translate(-50%, -50%); }
    #boot .dots i { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .35; animation: bPulse 1.1s ease-in-out infinite; }
    #boot .dots i:nth-child(2) { animation-delay: .15s; } #boot .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bPulse { 40% { opacity: 1; transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { #boot .dots i { animation: none; opacity: .7; } }
  </style>
</head>
<body>
  <div id="boot" role="img" aria-label="BAID X is loading"><div class="grid"></div><div class="dots"><i></i><i></i><i></i></div></div>
  <script>
    // Leave on the app's first frame (its own splash plays next); never hold the page more than 20 seconds.
    (function () {
      var boot = document.getElementById('boot'), done = false;
      function leave() { if (done) return; done = true; boot.classList.add('out'); setTimeout(function () { boot.remove(); }, 350); }
      window.addEventListener('flutter-first-frame', leave);
      setTimeout(leave, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
