<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BAID X · Ghana's work network</title>
  <meta name="description" content="Find verified professionals, companies, project managers and suppliers across Ghana. Hire, run projects and build trust, all in one place." />
  <meta name="application-name" content="BAID X" />
  <meta name="author" content="Baiden Creatives" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="https://baid-x-website.vercel.app/" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BAID X" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BAID X" />
  <meta property="og:locale" content="en_GH" />
  <meta property="og:title" content="BAID X · Ghana's work network" />
  <meta property="og:description" content="Find verified professionals, companies, project managers and suppliers across Ghana. Hire, run projects and build trust, all in one place." />
  <meta property="og:url" content="https://baid-x-website.vercel.app/" />
  <meta property="og:image" content="https://baid-x-website.vercel.app/assets/og-image.png?v=3" />
  <meta property="og:image:secure_url" content="https://baid-x-website.vercel.app/assets/og-image.png?v=3" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="BAID X: five roles, professionals, project managers, companies, suppliers and clients, connected around one trusted network. The future of work in Africa isn\'t about connections, it\'s about capability." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BAID X · Ghana's work network" />
  <meta name="twitter:description" content="Find verified professionals, companies, project managers and suppliers across Ghana. Hire, run projects and build trust, all in one place." />
  <meta name="twitter:image:alt" content="BAID X: the ecosystem of professionals, project managers, companies, suppliers and clients." />
  <meta name="twitter:image" content="https://baid-x-website.vercel.app/assets/og-image.png?v=3" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>

  <!-- Splash -->
  <div class="splash" id="splash" aria-label="BAID X">
    <img class="splash-logo" src="assets/favicon.png" alt="BAID X" />
    <div class="splash-by"><small>By</small><strong>Baiden Creatives</strong></div>
  </div>

  <!-- Directory: guest Home, member Discover -->
  <main class="screen" id="screen-directory">
    <div class="wrap">
      <header class="topbar">
        <div class="topbar-row">
          <img class="brand-logo" src="assets/logo.png" alt="BAID X" />
          <button class="btn-pro" id="joinBtn" data-action="join" data-group="pro">Join as a Pro</button>
          <button class="icon-btn" id="filterBtn" data-go="filters" aria-label="Filters" hidden>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h18l-7 8.500V20l-4-2v-4.500z"/></svg>
            <i class="dot" id="filterDot" hidden></i>
          </button>
        </div>
        <label class="search">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>
          <input id="q" type="search" placeholder="Search" autocomplete="off" />
        </label>
        <div class="chips" id="chips"></div>
      </header>
      <section class="grid" id="feed" aria-live="polite"></section>
    </div>
  </main>

  <!-- Desktop sidebar (members, wide screens) -->
  <aside class="sidebar" id="sidebar" aria-label="Main" hidden></aside>

  <!-- Role dashboards: Home, Jobs, Work, Wallet, Projects, Catalog... rendered by js/dash.js -->
  <main class="screen" id="screen-dash">
    <div class="wrap">
      <div id="dashBody"></div>
    </div>
  </main>

  <!-- Chats -->
  <main class="screen" id="screen-chats">
    <div class="wrap">
      <h1 class="page-title">Chats</h1>
      <div class="empty" id="chatsGuest">
        <svg width="150" height="150" viewBox="0 0 150 150" fill="none" aria-hidden="true">
          <path d="M30 70 75 50l45 20v42L75 132 30 112z" fill="#2b2b2b"/>
          <path d="M30 70 75 90l45-20" stroke="#d9d9d9" stroke-width="3" stroke-linejoin="round"/>
          <path d="M75 90v42" stroke="#d9d9d9" stroke-width="3"/>
          <path d="M30 70 45 52l30 10M120 70 105 52 75 62" stroke="#d9d9d9" stroke-width="3" stroke-linejoin="round"/>
          <path d="M60 28c6-8 20-8 24 2" stroke="#7a7a7a" stroke-width="2.500" stroke-dasharray="3 6" stroke-linecap="round"/>
          <circle cx="86" cy="32" r="4" fill="#d9d9d9"/><circle cx="26" cy="46" r="2.500" fill="#7a7a7a"/><circle cx="124" cy="96" r="2.500" fill="#7a7a7a"/>
        </svg>
        <h2>Sign in to view chats</h2>
        <p>Your conversations will appear here after you sign in.</p>
        <button class="btn-light" data-action="signin">Sign in</button>
      </div>
      <div id="chatsMember" hidden></div>
    </div>
  </main>

  <!-- Profile / Account -->
  <main class="screen" id="screen-profile">
    <div class="wrap">
      <div id="profileGuest">
        <h1 class="page-title center">Profile</h1>
        <div class="profile-wrap">
          <div class="guest-avatar">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.600"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.200"/><path d="M5.800 18.500c1.600-2.600 3.600-3.700 6.200-3.700s4.600 1.100 6.200 3.700" stroke-linecap="round"/></svg>
          </div>
          <button class="opt" data-action="signin" data-group="pro" style="margin-top:20px">
            <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.500"/><path d="M9 7V5.500A1.500 1.500 0 0 1 10.500 4h3A1.500 1.500 0 0 1 15 5.500V7M3 13h18"/></svg></span>
            <span><b>Sign in as a Pro</b><small>For professionals, project managers and suppliers</small></span>
            <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <button class="opt" data-action="signin" data-group="client">
            <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.500 12 4l9 7.500"/><path d="M5.500 10v9.500h13V10"/><path d="M10 19.500v-5h4v5"/></svg></span>
            <span><b>Sign in as a client</b><small>For homeowners hiring, and for companies</small></span>
            <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <p class="legal">By continuing you agree to the BAID X Terms and Privacy Policy.</p>
        </div>
      </div>

      <div id="profileMember" hidden>
        <header class="acc-head"><h1>Account</h1>
          <button class="icon-btn" data-soon aria-label="View public profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </header>
        <div class="acc-id">
          <div class="acc-avatar" id="accAvatar"></div>
          <h2 id="accName"></h2>
          <p id="accPhone"></p>
          <div class="tags"><span id="accRole"></span><span id="accStatus"></span></div>
        </div>
        <button class="acc-card check" data-go="checklist">
          <span class="ic warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span>
          <span class="tx"><b>Verification checklist</b><small>Complete required checks before your profile can be approved.</small></span>
          <span class="pill-n" id="accCount"></span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
        <div class="acc-group" id="accMenu"></div>
        <div class="acc-group" id="accAccount"></div>
        <div class="acc-group" id="accInfo"></div>
        <div class="acc-group"><button class="acc-row danger" id="logout"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></svg></span><span class="tx"><b>Log out</b></span></button></div>
      </div>
    </div>
  </main>

  <!-- Checklist -->
  <main class="screen sub" id="screen-checklist">
    <div class="wrap narrow">
      <header class="sub-head"><button class="icon-btn" data-back aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><h1>Checklist</h1><span></span></header>
      <div class="ck-card">
        <div class="ck-top"><span class="ic warn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><h2>BAID X verification</h2><span class="chip-s" id="ckStatus"></span></div>
        <p>Complete these checks before your profile can be approved.</p>
      </div>
      <div class="ck-card">
        <div class="ck-prog"><span id="ckDone"></span><span id="ckPct"></span></div>
        <div class="bar"><i id="ckBar"></i></div>
      </div>
      <div id="ckList"></div>
    </div>
  </main>

  <!-- Filters -->
  <main class="screen sub" id="screen-filters">
    <div class="wrap narrow">
      <header class="sub-head"><button class="icon-btn" data-back aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><h1>Filters</h1><span></span></header>
      <div id="fList"></div>
      <div class="f-foot"><button class="btn-dark" id="fClear">Clear</button><button class="btn-light" id="fApply">Apply filters</button></div>
    </div>
  </main>

  <!-- Generic picker (filters) -->
  <main class="screen sub" id="screen-picker">
    <div class="wrap narrow">
      <header class="sub-head"><button class="icon-btn" data-back aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><h1 id="pkTitle"></h1><span></span></header>
      <div id="pkList"></div>
    </div>
  </main>

  <!-- Bottom nav -->
  <nav class="nav" id="nav" aria-label="Main">
    <div class="nav-in" id="navIn"></div>
  </nav>

  <div id="sheetRoot"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dash.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/orgs.js"></script>
  <script src="js/billing.js"></script>
</body>
</html>
